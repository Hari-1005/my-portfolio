# Declarative label set for this repository. Kept in sync manually or with a
# label-sync tool; there is intentionally no sync workflow.
# Format: name, color (hex without #), description.

# Type
- name: "type:story"
  color: "1d76db"
  description: "User story from the product backlog"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is not working as intended"
- name: "type:chore"
  color: "c5def5"
  description: "Maintenance, dependencies or tooling with no user-facing change"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"

# Priority (MoSCoW)
- name: "priority:must"
  color: "b60205"
  description: "Must have for the current milestone"
- name: "priority:should"
  color: "d93f0b"
  description: "Should have; important but not blocking"
- name: "priority:could"
  color: "fbca04"
  description: "Could have; nice to include if time allows"
- name: "priority:wont"
  color: "e4e669"
  description: "Won't have this time; parked for later"

# Area
- name: "area:ui"
  color: "5319e7"
  description: "Layout, components, styling and design tokens"
- name: "area:content"
  color: "0e8a16"
  description: "MDX content, frontmatter schema and copy"
- name: "area:seo"
  color: "006b75"
  description: "Metadata, sitemap, robots and Open Graph"
- name: "area:a11y"
  color: "7057ff"
  description: "Accessibility (WCAG 2.1 AA)"
- name: "area:perf"
  color: "f9d0c4"
  description: "Performance and Core Web Vitals"
- name: "area:security"
  color: "ee0701"
  description: "Security headers, CSP and dependency vulnerabilities"
- name: "area:ci"
  color: "bfd4f2"
  description: "GitHub Actions workflows and checks"
- name: "area:infra"
  color: "d4c5f9"
  description: "Hosting, Vercel configuration, environments and dependencies"
