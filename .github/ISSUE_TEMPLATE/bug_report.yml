name: Bug report
description: Report something that is broken on the site or in the tooling.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Page or preview deployment where it happens.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Preview deployment
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
